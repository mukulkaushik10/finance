<style>
/* Layout: the real app's shells (staff sidebar app, supplier top-nav portal, sign-in screens) under a thin prototype bar that switches people. */
:root {

  --ink: #e6e9ee; --ink-2: #c4cad4; --muted: #8b95a5; --brand: #6f93ff; --brand-ink: #0d1117; --brand-soft: #1c2a4d;
  --sup: #3cc4b4; --sup-soft: #12312e; --good: #4cc38a; --good-soft: #143326; --warn: #e3a54a; --warn-soft: #3a2a12;
  --bad: #f07267; --bad-soft: #3d1a17; --info: #6aa8ec; --info-soft: #172a40; --neutral-soft: #222a35; --bar: #000000; --bar-ink: #d1d5db; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1117; --surface: #161b22; --surface-2: #1d232c; --border: #2a313c; --border-strong: #3a4250;
  --ink: #e6e9ee; --ink-2: #c4cad4; --muted: #8b95a5; --brand: #6f93ff; --brand-ink: #0d1117; --brand-soft: #1c2a4d;
  --sup: #3cc4b4; --sup-soft: #12312e; --good: #4cc38a; --good-soft: #143326; --warn: #e3a54a; --warn-soft: #3a2a12;
  --bad: #f07267; --bad-soft: #3d1a17; --info: #6aa8ec; --info-soft: #172a40; --neutral-soft: #222a35; --bar: #000000; --bar-ink: #d1d5db; color-scheme: dark; }

.pbar { background: var(--bar); color: var(--bar-ink); padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 12px; }

.pbar .sp { flex: 1; }

.t-good { background: var(--good-soft); color: var(--good); } .t-warn { background: var(--warn-soft); color: var(--warn); }
.t-bad { background: var(--bad-soft); color: var(--bad); } .t-info { background: var(--info-soft); color: var(--info); }
.t-neutral { background: var(--neutral-soft); color: var(--ink-2); } .t-brand { background: var(--brand-soft); color: var(--brand); } .t-sup { background: var(--sup-soft); color: var(--sup); }

.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.p { background: var(--brand); color: var(--brand-ink); }
.btn.sec { background: var(--surface); border-color: var(--border-strong); }
.btn.sec:hover { background: var(--surface-2); }
.btn.good { background: var(--good); color: #fff; } .btn.bad { background: var(--bad); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink-2); } .btn.ghost:hover { background: var(--surface-2); }

.chk-l { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; padding: 9px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.hov:hover td { background: var(--surface-2); }
.r { text-align: right; }
.lnk { color: var(--brand); font-weight: 600; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }

.back { font-size: 13px; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; justify-self: start; }
.alert { border-radius: 9px; padding: 10px 14px; font-size: 13px; }

.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px 18px; margin: 0; }

.tot { display: grid; justify-content: end; gap: 3px; font-size: 13px; }
.tot div { display: flex; gap: 28px; justify-content: space-between; }
.tot .big { font-weight: 650; font-size: 16px; }
.rl { list-style: none; margin: 0; padding: 0; display: grid; }
.rl li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.rl li:last-child { border-bottom: 0; }
.ic { width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; margin-top: 1px; }
.ic.ok { background: var(--good-soft); color: var(--good); } .ic.w { background: var(--warn-soft); color: var(--warn); } .ic.x { background: var(--bad-soft); color: var(--bad); } .ic.na { background: var(--neutral-soft); color: var(--muted); }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-weight: 500; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--brand-soft); color: var(--brand); }
.supmode .tabs button[aria-selected="true"] { background: var(--sup-soft); color: var(--sup); }
.tabs .n { color: var(--muted); font-size: 12px; margin-left: 3px; }
.utabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.utabs button { border: 0; background: transparent; padding: 9px 14px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.utabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); }
.po-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.po { text-align: left; border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; background: var(--surface); cursor: pointer; display: grid; gap: 2px; }

.empty { padding: 34px 16px; text-align: center; color: var(--muted); }

.lvl { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }

.overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: grid; place-items: center; padding: 16px; z-index: 30; }
.modal { background: var(--surface); border-radius: 12px; width: min(640px, 100%); max-height: 85vh; overflow: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 9px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px); z-index: 40; }
.auth { min-height: calc(100vh - 34px); display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg); }
.auth .box { width: min(400px, 100%); display: grid; gap: 18px; }
.auth .wide { width: min(560px, 100%); }
.persona { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 9px 12px; cursor: pointer; text-align: left; }
.persona:hover { border-color: var(--brand); background: var(--brand-soft); }
.pill-ro { background: var(--info-soft); color: var(--info); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 500; }

@media (max-width: 1100px) { .two { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 820px) {
  .shell { flex-direction: column; }
  .side { width: 100%; border-right: 0; border-bottom: 1px solid var(--border); }
  .side .stick { position: static; min-height: 0; }
  .side nav { display: flex; overflow-x: auto; }
  .side nav button { white-space: nowrap; }
  .side .foot { display: none; }
  .topbar { padding: 0 16px; }
  .content, .sup-content { padding: 16px; }
  .sup-top .in { height: auto; flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
  .lvl { grid-template-columns: 1fr 1fr; }
  .cmp, .grid2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .prog > div { transition: none; } }

"use strict";
/* ============================================================ utilities */
const DAY = 864e5;
const NOW = new Date();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (c, cur = "USD") => (c < 0 ? "−" : "") + "$" + (Math.abs(c) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtK = (c) => { const d = Math.abs(c) / 100; const s = d >= 1e6 ? (d / 1e6).toFixed(2) + "M" : d >= 1e4 ? (d / 1e3).toFixed(1) + "k" : d.toLocaleString("en-US", { maximumFractionDigits: 0 }); return (c < 0 ? "−$" : "$") + s; };
const pct = (x, d = 1) => (x === null || x === undefined || isNaN(x) ? "-" : (x * 100).toFixed(d) + "%");
const dFmt = (d) => d ? new Date(d).toLocaleDateString("en-US", { day: "numeric", month: "short", year: "numeric" }) : "-";
const tFmt = (d) => d ? new Date(d).toLocaleString("en-US", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" }) : "-";
const iso = (d) => new Date(d).toISOString().slice(0, 10);
const parseMoney = (s) => { const r = String(s).trim().replace(/[$,\s]/g, ""); if (!/^-?\d+(\.\d{1,2})?$/.test(r)) return null; return Math.round(parseFloat(r) * 100); };
const uid = (p) => p + Math.random().toString(36).slice(2, 10);

function rng(seed) { // mulberry32 seeded from a string
  let h = 1779033703 ^ seed.length;
  for (let i = 0; i < seed.length; i++) { h = Math.imul(h ^ seed.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }

  return { next, int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)), pick: (arr) => arr[Math.floor(next() * arr.length)] };
}
const unit = (...parts) => rng(parts.join("|")).next();

/* SHA-256 (sync), for the audit hash chain */
const sha256 = (() => {
  const K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  const enc = new TextEncoder();
  return (str) => {
    const msg = enc.encode(str); const l = msg.length;

function ruleSentence(r) {
  const p = r.params;
  switch (r.type) {
    case "three_way_match": return `Send to a person unless the invoice is within ${p.tolPct}% of its PO and the goods have been received in full`;
    case "approval_limits": return p.bands.map((b, i) => { const lo = i === 0 ? 0 : p.bands[i - 1][0]; return `${fmt(lo)}${b[0] ? ` – ${fmt(b[0])}` : " and above"}: ${b[1] ? APPROVER[b[1]].toLowerCase() : "no approval needed"}`; }).join("; ");
    case "duplicate_invoice": return `Block an invoice with the same number, or the same vendor and amount within ${p.windowDays} days, as an earlier one`;
    case "bank_details_change": return `Send to a person when bank details differ from the vendor record or changed in the last ${p.lookbackDays} days`;
    case "blocked_vendor": return "Block any invoice from a vendor on the blocked list";
    case "custom": return `${p.severity === "block" ? "Block" : "Send to a person"} when ${CUSTOM_FIELDS[p.field].toLowerCase()} ${CUSTOM_OPS[p.op]} ${p.field === "amount" ? fmt(p.value) : esc(p.value)}`;
  }
}

/** ctx: { subject, vendor, po, grnQty, prior: [{number, amount, date}], confidence } */

      if (!po) return out("fail", `Can't find ${s.po} in the system of record`);
      const diff = (s.amount - po.amount) / po.amount;
      if (Math.abs(diff) * 100 > p.tolPct) return out("fail", `Invoice ${fmt(s.amount)} is ${(Math.abs(diff) * 100).toFixed(1)}% ${diff > 0 ? "above" : "below"} ${po.n} (${fmt(po.amount)}); tolerance is ${p.tolPct}%`);
      if (ctx.grnQty === null) return out("fail", `No goods received note for ${po.n}`);
      if (ctx.grnQty < po.qty) return out("fail", `Only ${ctx.grnQty} of ${po.qty} units received on ${po.n}`);
      return out("pass", `Matches ${po.n} and goods received in full`);
    }
    case "approval_limits": {
      let lo = 0;

    if (blocking.length) { computed = "block"; reasons.push(...blocking.map((r) => r.explanation)); }
    else {
      reasons.push(...failed.map((r) => r.explanation));
      if (!confOk) reasons.push(confReason);
      if (reasons.length) computed = "needs_human";
      else if (eff === 1) { computed = "needs_human"; reasons.push("Level 1: a person approves every invoice"); }
      else if (eff === 2 && amount > limit) { computed = "needs_human"; reasons.push(`${fmt(amount)} is above the ${fmt(limit)} auto-approve limit`); }
      else { computed = "auto_approve"; reasons.push(eff === 2 ? `Passed every rule and is within the ${fmt(limit)} auto-approve limit` : "Passed every rule"); }

    else { computed = "needs_human"; reasons.push(confOk ? "A person confirms every rejection below Level 3" : confReason); }

    reasons: shadow ? [`Shadow mode: recorded only. Would have been ${OUT[computed]}`, ...reasons] : reasons };

const vendorByCode = (c) => S.vendors.find((v) => v.code === c);

  const a = {

    amount: subject.amount, po: subject.po, grn: subject.grn, invoiceDate: subject.date, source: subject.source ?? "agent",
    agentId: agent.id, agentVersion: agent.version, proposed: proposal.decision, gl: proposal.gl ?? ctx.vendor?.gl ?? "6900", reason: proposal.reason, confidence: proposal.confidence,
    results, reasons: g.reasons, status: g.status, computed: g.computed, enforced: g.enforced, requiredRole: g.requiredRole, level: wf.level,
    ruleSet: rules.map((r) => `${r.id}@${r.version}`).join(","), createdAt: new Date(at), decidedAt: g.status === "pending_review" ? null : new Date(at),

const isControlFailure = (r) => r.result === "fail" && !r.routing;

function reviewAction(user, actionId, { decision, reason, rightToEscalate = true }, at = new Date(), opts = {}) {
  const a = S.actions.find((x) => x.id === actionId);
  if (!a) throw new Error("Invoice not found");
  if (a.review) throw new Error("This invoice has already been reviewed");
  const spot = a.status === "logged";
  if (a.status !== "pending_review" && !spot) throw new Error("This invoice isn't waiting for review");
  if (!spot && RANK[user.role] < RANK[a.requiredRole ?? "reviewer"]) throw new Error(`This invoice needs a decision by ${APPROVER[a.requiredRole].toLowerCase()}`);
  if (user.role === "auditor") throw new Error("Auditors can't make decisions");
  if (!reason || reason.trim().length < 10) throw new Error("Please give a reason of at least a few words");
  const correct = a.proposed === "escalate" && rightToEscalate ? "escalate" : decision;
  a.review = { by: user.id, byName: user.name, decision, reason, correct, agentCorrect: a.proposed === correct, at: new Date(at), spot };

    invoice: a.number, reviewer: `${user.name} (${ROLE_LABEL[user.role]})`, decision, reason, agentProposed: a.proposed, agentWasCorrect: a.review.agentCorrect, overriddenRules: overridden, spotCheck: spot,

/* ---- autonomy */
function changeLevel(user, to, reason, at = new Date()) {

  if (to === wf.level) throw new Error("That's already the current level");
  if (!reason || reason.trim().length < 10) throw new Error("Give a reason of at least a few words");
  if (to > wf.level && to > 0) {

function saveRule(user, rule, params, reason, extra = {}) {
  if (!can(user.role, "rules:edit")) throw new Error("Your role can't change rules");
  if (!reason || reason.trim().length < 5) throw new Error("Say briefly why you're changing this rule");
  rule.version += 1; rule.params = params; Object.assign(rule, extra);
  rule.versions.unshift({ v: rule.version, params: JSON.parse(JSON.stringify(params)), reason, by: user.name, at: new Date(), enabled: rule.enabled, severity: rule.severity });
  audit("rule.changed", "rule", rule.id, { type: "user", id: user.id, name: user.name }, { rule: rule.name, version: rule.version, sentence: ruleSentence(rule), enabled: rule.enabled, reason });
}

/* ---- generator (replay set and live history) */
function genInvoices(seed, count, start, end, opts) {
  const r = rng(seed);
  const out = [];
  const span = end.getTime() - start.getTime();
  const pool = S.vendors.filter((v) => !["V-0002", "V-0005", "V-0009"].includes(v.code));
  for (let i = 0; i < count; i++) {
    const roll = r.next();
    let issue = roll < 0.80 ? null : roll < 0.84 ? "duplicate" : roll < 0.89 ? "over_po" : roll < 0.93 ? "missing_grn" : roll < 0.95 ? "blocked" : roll < 0.97 ? "bank_changed" : "no_po";
    let vendor = issue === "blocked" ? r.pick(pool.filter((v) => v.blocked)) : issue === "bank_changed" ? r.pick(pool.filter((v) => !v.blocked)) : r.pick(pool.filter((v) => !v.blocked));
    const date = new Date(start.getTime() + (span * (i + r.next())) / count);
    let amount = Math.round(Math.exp(Math.log(18000) + r.next() * (Math.log(4200000) - Math.log(18000))) / 100) * 100 + r.int(0, 99);
    const id = `${opts.prefix}-${String(opts.startNo + i).padStart(5, "0")}`;
    let number = id;
    if (issue === "duplicate" && out.length) {
      const orig = r.pick(out.filter((x) => !x.issue).slice(-25));
      if (orig) { vendor = vendorByCode(orig.vendorCode); amount = orig.amount; number = r.next() < 0.5 ? orig.number : orig.number + "-A"; }
      else issue = null;
    } else if (issue === "duplicate") issue = null;
    const n = `PO-${opts.poStart + i}`;
    const qty = r.int(1, 60);
    const poAmount = issue === "over_po" ? Math.round(amount / 1.12) : amount;
    let po = issue === "no_po" ? null : n;
    if (po && issue !== "duplicate") {
      S.pos[n] = { n, vendorCode: vendor.code, amount: poAmount, qty, unit: Math.round(poAmount / qty), closed: opts.closed, raised: new Date(date.getTime() - 9 * DAY) };
      S.grns[n] = issue === "missing_grn" ? (r.next() < 0.5 ? undefined : Math.max(0, qty - r.int(1, qty))) : qty;
      if (S.grns[n] === undefined) delete S.grns[n];
    }
    if (issue === "duplicate") { const orig = out.find((x) => x.number === number || x.number + "-A" === number); po = orig?.po ?? null; }
    out.push({
      id, number, vendorCode: vendor.code, vendorName: vendor.name, amount, po, grn: po && S.grns[po] !== undefined ? po.replace("PO", "GRN") : null,
      date: iso(date), at: date, bankFp: issue === "bank_changed" ? fingerprint(vendor.code + ":unknown") : vendor.bankFp, issue, correct: correctFor(issue), gl: vendor.gl,
    });
  }
  return out;
}

/* ---- buyer bank accounts */
function addBankAccount(user, d, at = new Date()) {
  if (!can(user.role, "*") && user.role !== "admin") throw new Error("Only admins can add bank accounts");
  if (!d.nickname || d.nickname.trim().length < 2) throw new Error("Give the account a name");
  if (!d.holder || !d.bank) throw new Error("Enter the account holder and bank");
  if (!routingValid(d.routing)) throw new Error("Enter a valid 9-digit US routing number");
  const acct = String(d.account).replace(/\D/g, "");
  if (acct.length < 4 || acct.length > 17) throw new Error("Account numbers are 4 to 17 digits");
  const fp = fingerprint(d.routing + ":" + acct);
  if (S.bankAccounts.some((b) => b.fp === fp && b.state === "active")) throw new Error("This account is already set up");
  const def = d.isDefault || !S.bankAccounts.some((b) => b.state === "active");
  if (def) S.bankAccounts.forEach((b) => (b.isDefault = false));
  const b = { id: uid("ba_"), nickname: d.nickname.trim(), holder: d.holder, bank: d.bank, routing: String(d.routing).replace(/\D/g, ""), last4: acct.slice(-4), fp, isDefault: def, state: "active", at: new Date(at) };
  S.bankAccounts.push(b);
  audit("bank_account.added", "bank_account", b.id, { type: "user", id: user.id, name: user.name }, { nickname: b.nickname, bank: b.bank, routing: b.routing, last4: b.last4, isDefault: def }, at);
  return b;
}

/* ---- supplier portal */
function supplierCtx(supUserId) {
  const u = S.supplierUsers.find((x) => x.id === supUserId);
  return { user: u, account: S.supplierAccounts.find((a) => a.id === u.accountId) };
}
const connsFor = (sctx) => S.connections.filter((c) => c.accountId === sctx.account.id && c.status !== "invited");
const bankOf = (c) => S.supplierBanks.find((b) => b.id === c?.bankId) ?? null;
const invTotal = (inv) => inv.lines.reduce((t, l) => t + l.q * l.u + Math.round((l.q * l.u * (l.tax || 0)) / 10000), 0);
const invSubtotal = (inv) => inv.lines.reduce((t, l) => t + l.q * l.u, 0);
const connOf = (inv) => S.connections.find((c) => c.id === inv.connId);
function event(inv, status, note, who, at = new Date()) { inv.events.push({ status, note, who, at: new Date(at) }); }

function openPOs(sctx, connId) {
  const c = S.connections.find((x) => x.id === connId);
  return Object.values(S.pos).filter((p) => p.vendorCode === c.vendorCode && !p.closed).map((p) => {
    const billed = S.invoices.filter((i) => i.connId === c.id && i.kind === "invoice" && i.po === p.n && !["draft", "cancelled", "rejected"].includes(i.status));
    const qtyBilled = billed.reduce((t, i) => t + i.lines.reduce((q, l) => q + l.q, 0), 0);
    const amtBilled = billed.reduce((t, i) => t + invSubtotal(i), 0);
    return { ...p, received: S.grns[p.n] ?? 0, qtyBilled, amtBilled, remaining: Math.max(0, p.amount - amtBilled) };
  }).filter((p) => p.remaining > 0).sort((a, b) => b.raised - a.raised);
}

function createDraft(sctx, d, at = new Date()) {
  const c = S.connections.find((x) => x.id === d.connId);
  if (!c || c.accountId !== sctx.account.id) throw new Error("Choose one of your buyers");
  if (c.status !== "active") throw new Error("Your access to this buyer is suspended");
  if (!d.number || !/^[A-Za-z0-9][A-Za-z0-9\-_/.]*$/.test(d.number)) throw new Error("Enter your invoice number (letters, numbers and - _ / . only)");
  if (S.invoices.some((i) => i.connId === c.id && i.kind === (d.kind ?? "invoice") && i.number === d.number)) throw new Error(`You've already used number ${d.number} with ${S.org.name}. Each invoice needs its own number.`);
  if (!d.lines.length) throw new Error("Add at least one line");
  for (const l of d.lines) { if (!l.d) throw new Error("Describe what each line is for"); if (!(l.q >= 1)) throw new Error("Quantities must be at least 1"); if (!(l.u >= 0)) throw new Error("Enter a unit price for every line"); }
  const inv = {
    id: uid("inv_"), connId: c.id, accountId: sctx.account.id, vendorCode: c.vendorCode, kind: d.kind ?? "invoice", creditFor: d.creditFor ?? null,
    number: d.number, status: "draft", po: d.po || null, grn: null, date: d.date, due: d.due || iso(new Date(new Date(d.date).getTime() + c.terms * DAY)), notes: d.notes || "",
    lines: d.lines.map((l) => ({ ...l })), revision: 0, actionId: null, supplierNote: null, events: [], msgs: [], createdAt: new Date(at),
    sentAt: null, payOn: null, payFrom: null, paidOn: null, ref: null, bankFp: null,
  };
  event(inv, "draft", null, sctx.user.name, at);
  S.invoices.unshift(inv);
  return inv;
}

function checksFor(sctx, inv) {
  const c = connOf(inv); const out = []; const bank = bankOf(c);
  if (!bank) out.push(["x", `${S.org.name} hasn't approved your bank details yet. Add them under Bank details; you can send once they approve.`]);
  else out.push(["ok", `Payment will go to ${bank.bank} account ending ${bank.last4}`]);
  if (new Date(inv.date) > new Date(NOW.getTime() + DAY)) out.push(["x", "The invoice date is in the future"]);
  if (invTotal(inv) <= 0) out.push(["x", "The total must be more than zero"]);
  if (inv.kind === "credit_note") {
    const orig = S.invoices.find((i) => i.id === inv.creditFor);
    if (orig && invTotal(inv) > invTotal(orig)) out.push(["x", `The credit is more than invoice ${orig.number} (${fmt(invTotal(orig))})`]);
    return out;
  }
  const dupe = S.invoices.find((i) => i.connId === c.id && i.id !== inv.id && i.kind === "invoice" && !["draft", "cancelled", "rejected"].includes(i.status) && invTotal(i) === invTotal(inv));
  if (dupe) out.push(["w", `You already sent invoice ${dupe.number} for the same amount. If this is a copy, don't send it; the buyer will hold it as a possible duplicate.`]);
  if (!inv.po) { out.push(["w", "There's no purchase order number. Invoices without one usually take longer to approve."]); return out; }
  const p = S.pos[inv.po];
  if (!p || p.vendorCode !== c.vendorCode) { out.push(["w", `${S.org.name} has no purchase order ${inv.po} for you. Check the number with your contact.`]); return out; }
  const open = openPOs(sctx, c.id).find((x) => x.n === inv.po);
  const mineBilled = ["needs_changes"].includes(inv.status) ? 0 : 0;
  if (!open) { out.push(["w", `${inv.po} has already been billed in full`]); return out; }
  out.push(invSubtotal(inv) > open.remaining + mineBilled ? ["w", `This is more than what's left on ${p.n} (${fmt(open.remaining)}). It will need extra approval.`] : ["ok", `Within what's left on ${p.n}`]);
  const qty = inv.lines.reduce((t, l) => t + l.q, 0); const ready = Math.max(0, open.received - open.qtyBilled);
  if (open.received === 0) out.push(["w", `${S.org.name} hasn't recorded a delivery for ${p.n} yet`]);
  else if (qty > ready) out.push(["w", `${S.org.name} has recorded ${ready} unbilled unit${ready === 1 ? "" : "s"} delivered on ${p.n}, and this invoice bills ${qty}`]);
  else out.push(["ok", "Matches what was delivered"]);
  return out;
}

function submitInvoice(sctx, invId, at = new Date()) {
  const inv = S.invoices.find((i) => i.id === invId && i.accountId === sctx.account.id);
  if (!inv) throw new Error("Invoice not found");
  if (!["draft", "needs_changes"].includes(inv.status)) throw new Error("This invoice has already been sent");
  const errs = checksFor(sctx, inv).filter((c) => c[0] === "x");
  if (errs.length) throw new Error(errs.map((e) => e[1]).join(" "));
  const c = connOf(inv); const v = vendorByCode(c.vendorCode);
  const resend = inv.revision > 0;
  inv.status = "submitted"; inv.revision += 1; inv.sentAt = new Date(at); inv.supplierNote = null; inv.bankFp = bankOf(c).fp;
  inv.grn = inv.po && S.grns[inv.po] !== undefined ? inv.po.replace("PO", "GRN") : null;
  event(inv, "submitted", resend ? "Corrected and sent again" : null, sctx.user.name, at);
  audit("invoice.submitted", "invoice", inv.id, { type: "supplier", id: sctx.user.id, name: sctx.user.name }, { invoice: inv.number, vendor: v.name, total: invTotal(inv), po: inv.po, revision: inv.revision, kind: inv.kind });
  const later = new Date(new Date(at).getTime() + 1000);
  if (inv.kind === "credit_note") { inv.status = "under_review"; event(inv, "under_review", `With ${S.org.name}'s accounts payable team for approval`, null, later); return inv; }
  const agent = agentById(S.workflow.primaryAgent);
  const subject = { id: inv.id, number: inv.number, vendorCode: v.code, vendorName: v.name, amount: invTotal(inv), po: inv.po, grn: inv.grn, date: inv.date, bankFp: inv.bankFp, source: "supplier portal" };
  const po = inv.po ? S.pos[inv.po] : null;
  const issue = !inv.po ? "no_po" : !po || Math.abs(subject.amount - po.amount) / po.amount > 0.05 ? "over_po" : S.grns[inv.po] === undefined || S.grns[inv.po] < po.qty ? "missing_grn" : null;
  const p = mockDecide(agent, { ...subject, id: inv.id + ":" + inv.revision }, issue);
  const a = evaluate(agent, { ...subject, truth: correctFor(issue) }, { decision: p.decision, confidence: p.confidence, reason: p.reason, gl: v.gl }, later);
  inv.actionId = a.id;
  syncInvoice(a.id, later);
  return inv;
}

function syncInvoice(actionId, at = new Date()) {
  const inv = S.invoices.find((i) => i.actionId === actionId);
  if (!inv || !["submitted", "under_review"].includes(inv.status)) return;
  const a = S.actions.find((x) => x.id === actionId);
  let next;
  if (a.status === "auto_approved" || a.status === "approved") next = "approved";
  else if (a.status === "rejected") next = "needs_changes";
  else if (a.status === "logged" && a.review) next = a.review.decision === "approve" ? "approved" : "needs_changes";
  else next = "under_review";
  if (next === inv.status) return;
  const notes = { under_review: `With ${S.org.name}'s accounts payable team for approval`, approved: "Approved for payment", needs_changes: "The buyer couldn't approve this invoice as sent. Check the messages, fix it and send it again." };
  inv.status = next; if (next !== "under_review") inv.supplierNote = notes[next];
  event(inv, next, notes[next], a.review ? a.review.byName : null, at);
}

function decideInvoice(user, invId, { decision, reason, message }, at = new Date()) {
  if (!can(user.role, "review")) throw new Error("Your role can't decide invoices");
  const inv = S.invoices.find((i) => i.id === invId);
  if (inv.status !== "under_review") throw new Error("This invoice isn't waiting for a decision");
  if (!reason || reason.trim().length < 10) throw new Error("Please give a reason of at least a few words");
  if (decision !== "approve" && (!message || message.trim().length < 5)) throw new Error("Tell the supplier what to fix or why");
  const a = inv.actionId ? S.actions.find((x) => x.id === inv.actionId) : null;
  if (a?.status === "blocked" && decision === "approve") throw new Error("A control blocked this invoice, so it can't be approved. Send it back or reject it.");
  if (a && !a.review && (a.status === "pending_review" || a.status === "logged")) reviewAction(user, a.id, { decision: decision === "approve" ? "approve" : "reject", reason }, at, { skipInvoiceSync: true });
  const next = { approve: "approved", send_back: "needs_changes", reject: "rejected" }[decision];
  const note = message || (next === "approved" ? "Approved for payment" : "The buyer rejected this invoice.");
  inv.status = next; inv.supplierNote = note;
  event(inv, next, note, user.name, at);
  if (message) inv.msgs.push({ from: "buyer", by: user.name, body: message, at: new Date(at) });
  audit("invoice.decided", "invoice", inv.id, { type: "user", id: user.id, name: user.name }, { invoice: inv.number, decision, reason, messageToSupplier: message ?? null }, at);
}

function schedulePayment(user, invId, { from, payOn }, at = new Date(), allowPast = false) {
  if (!can(user.role, "payments")) throw new Error("Your role can't schedule payments");
  const inv = S.invoices.find((i) => i.id === invId); const c = connOf(inv); const v = vendorByCode(c.vendorCode);
  if (inv.kind !== "invoice") throw new Error("Credit notes aren't paid; they reduce what you owe");
  if (!["approved", "scheduled"].includes(inv.status)) throw new Error("Only approved invoices can be scheduled");
  if (v.blocked) throw new Error(`${v.name} is blocked. Payments can't be scheduled.`);
  if (S.bankChanges.some((b) => b.connId === c.id && b.status === "pending")) throw new Error("This supplier has a bank detail change waiting for approval. Decide it first.");
  const bank = bankOf(c);
  if (!bank) throw new Error("The supplier has no approved bank account");
  if (inv.bankFp && bank.fp !== inv.bankFp) throw new Error("The supplier's bank details changed after this invoice was sent. Ask them to send it again.");
  const acct = S.bankAccounts.find((b) => b.id === from && b.state === "active");
  if (!acct) throw new Error("Choose one of your active bank accounts");
  if (!allowPast && new Date(payOn) < new Date(iso(NOW))) throw new Error("Choose today or a later date");
  inv.status = "scheduled"; inv.payOn = payOn; inv.payFrom = acct.id;
  event(inv, "scheduled", `Payment of ${fmt(invTotal(inv))} scheduled for ${dFmt(payOn + "T12:00")} to your account ending ${bank.last4}`, user.name, at);
  audit("invoice.payment_scheduled", "invoice", inv.id, { type: "user", id: user.id, name: user.name }, { invoice: inv.number, amount: invTotal(inv), payOn, payFrom: `${acct.nickname} ••${acct.last4}`, payTo: `${bank.bank} ••${bank.last4}` }, at);
}
function markPaid(user, invId, { paidOn, ref }, at = new Date()) {
  if (!can(user.role, "payments")) throw new Error("Your role can't record payments");
  const inv = S.invoices.find((i) => i.id === invId);
  if (inv.status !== "scheduled") throw new Error("Schedule the payment before recording it as paid");
  if (!ref || ref.trim().length < 3) throw new Error("Enter the payment reference from your bank");
  inv.status = "paid"; inv.paidOn = paidOn; inv.ref = ref.trim();
  event(inv, "paid", `Paid ${fmt(invTotal(inv))} on ${dFmt(paidOn + "T12:00")}. Payment reference ${inv.ref}`, user.name, at);
  audit("invoice.paid", "invoice", inv.id, { type: "user", id: user.id, name: user.name }, { invoice: inv.number, amount: invTotal(inv), paidOn, reference: inv.ref }, at);
}

function requestBankChange(sctx, d, at = new Date()) {
  if (d.password !== sctx.user.password) throw new Error("Your password is incorrect");
  if (!d.holder || d.holder.trim().length < 2 || !d.bank) throw new Error("Enter the account holder and bank name");
  if (!routingValid(d.routing)) throw new Error("Enter a valid 9-digit US routing number");
  const acct = String(d.account).replace(/\D/g, "");
  if (acct.length < 4 || acct.length > 17) throw new Error("Account numbers are 4 to 17 digits");
  if (acct !== String(d.confirm).replace(/\D/g, "")) throw new Error("The account numbers don't match");
  const fp = fingerprint(String(d.routing).replace(/\D/g, "") + ":" + acct);
  let b = S.supplierBanks.find((x) => x.accountId === sctx.account.id && x.fp === fp);
  if (!b) { b = { id: uid("sb_"), accountId: sctx.account.id, holder: d.holder, bank: d.bank, routing: String(d.routing).replace(/\D/g, ""), last4: acct.slice(-4), fp, at: new Date(at) }; S.supplierBanks.push(b); }
  const requested = [];
  for (const c of connsFor(sctx).filter((c) => c.status === "active")) {
    if (c.bankId === b.id) continue;
    S.bankChanges.filter((x) => x.connId === c.id && x.status === "pending").forEach((x) => (x.status = "withdrawn"));
    S.bankChanges.unshift({ id: uid("bc_"), connId: c.id, newBankId: b.id, prevBankId: c.bankId, status: "pending", requestedBy: sctx.user.name, at: new Date(at), decidedBy: null, verification: null, note: null });
    audit("supplier.bank_change_requested", "vendor", c.vendorCode, { type: "supplier", id: sctx.user.id, name: sctx.user.name }, { vendor: vendorByCode(c.vendorCode).name, newAccount: `${b.bank} ••${b.last4}`, routing: b.routing }, at);
    requested.push(c);
  }
  return requested;
}
function decideBankChange(user, id, { decision, verification, note }, at = new Date()) {
  if (!can(user.role, "suppliers:manage")) throw new Error("Your role can't decide bank changes");
  const ch = S.bankChanges.find((x) => x.id === id);
  if (ch.status !== "pending") throw new Error("This request has already been decided");
  if (decision === "approve" && (!verification || verification.trim().length < 10)) throw new Error("Say how you confirmed the change with the supplier");
  if (decision === "reject" && (!note || note.trim().length < 5)) throw new Error("Give a reason the supplier will see");
  const c = S.connections.find((x) => x.id === ch.connId); const v = vendorByCode(c.vendorCode); const b = S.supplierBanks.find((x) => x.id === ch.newBankId);
  ch.status = decision === "approve" ? "approved" : "rejected"; ch.decidedBy = user.name; ch.decidedAt = new Date(at); ch.verification = verification || null; ch.note = note || null;
  if (decision === "approve") { c.bankId = b.id; v.bankFp = b.fp; v.bankChangedAt = new Date(at); }
  audit("supplier.bank_change_decided", "vendor", v.code, { type: "user", id: user.id, name: user.name }, { vendor: v.name, decision, verification: verification ?? null, note: note ?? null, newAccount: `${b.bank} ••${b.last4}` }, at);
}

function vScorecard() {
  const weeks = weekly().slice(-8);
  const sel = U.p.week !== undefined ? weeks[U.p.week] : weeks[weeks.length - 2]; // last full week
  const idx = weeks.indexOf(sel); const prev = weeks[idx - 1];
  const delta = (cur, p, f, good) => { if (!p || cur === null || p === null) return ""; const d = cur - p; if (Math.abs(d) < 1e-9) return "no change"; const up = d > 0; return `<span class="${up === good ? "good" : "bad"}">${up ? "▲" : "▼"} ${f(Math.abs(d))}</span> vs prior week`; };
  const drill = (flag, label, val, sub, tone = "") => `<button class="stat" data-a="drill" data-flag="${flag}" data-week="${iso(sel.start)}"><div class="l">${label}</div><div class="v ${tone}">${val}</div><div class="s">${sub}</div></button>`;
  const maxV = Math.max(...weeks.map((w) => w.volume));
  const W = 720, H = 220, pad = 34, bw = (W - pad * 2) / weeks.length;
  const chart = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Invoices per week and agent accuracy">
    ${[0, 0.5, 1].map((t) => `<line x1="${pad}" x2="${W - pad}" y1="${H - 28 - t * (H - 50)}" y2="${H - 28 - t * (H - 50)}" stroke="var(--border)"/><text x="${pad - 6}" y="${H - 24 - t * (H - 50)}" text-anchor="end">${Math.round(t * maxV)}</text><text x="${W - pad + 6}" y="${H - 24 - t * (H - 50)}">${Math.round(80 + t * 20)}%</text>`).join("")}
    ${weeks.map((w, i) => { const x = pad + i * bw + bw * 0.2, bwid = bw * 0.6; const hAuto = (w.autoCount / maxV) * (H - 50), hAll = (w.volume / maxV) * (H - 50);
      return `<rect x="${x}" y="${H - 28 - hAll}" width="${bwid}" height="${hAll - hAuto}" rx="2" fill="var(--border-strong)"/><rect x="${x}" y="${H - 28 - hAuto}" width="${bwid}" height="${hAuto}" rx="2" fill="var(--brand)" opacity="${w === sel ? 1 : 0.55}"/><text x="${x + bwid / 2}" y="${H - 10}" text-anchor="middle">${w.start.toLocaleDateString("en-US", { month: "short", day: "numeric" })}</text>`; }).join("")}
    <polyline fill="none" stroke="var(--good)" stroke-width="2.5" points="${weeks.map((w, i) => w.accuracy === null ? "" : `${pad + i * bw + bw / 2},${H - 28 - ((Math.max(0.8, w.accuracy) - 0.8) / 0.2) * (H - 50)}`).join(" ")}"/>
    ${weeks.map((w, i) => w.accuracy === null ? "" : `<circle cx="${pad + i * bw + bw / 2}" cy="${H - 28 - ((Math.max(0.8, w.accuracy) - 0.8) / 0.2) * (H - 50)}" r="${w === sel ? 4.5 : 3}" fill="var(--good)"/>`).join("")}
  </svg>`;
  return ph("Scorecard", "How the AP agent did, week by week. Every number opens the invoices behind it.",
    `<select class="i" style="width:auto" data-a="week">${weeks.map((w, i) => `<option value="${i}" ${w === sel ? "selected" : ""}>Week of ${dFmt(w.start)}</option>`).join("")}</select>`) + `
  <div class="stats six">
    ${drill("all", "Invoices processed", sel.volume, delta(sel.volume, prev?.volume, (x) => x, true))}
    ${drill("reviewed", "Agent accuracy", pct(sel.accuracy), delta(sel.accuracy, prev?.accuracy, (x) => pct(x), true) || "Where a person checked its work", sel.accuracy >= S.workflow.target ? "good" : "")}
    ${drill("escalated", "Sent to a person", pct(sel.escalation), delta(sel.escalation, prev?.escalation, (x) => pct(x), false) || "Escalation rate")}
    ${drill("auto", "Approved automatically", fmtK(sel.autoAmount), `${sel.autoCount} invoices`)}
    ${drill("money_at_risk", "Money at risk", fmtK(sel.risk), sel.riskCount ? `${sel.riskCount} approved despite a failed check` : "Nothing approved past a failed check", sel.risk ? "bad" : "good")}
    ${drill("all", "Cost per invoice", fmt(sel.costPer), "Agent fee plus people's review time")}
  </div>
  <div class="card"><div class="ch"><div><h3>Volume and accuracy</h3><p>Bars: invoices per week (blue: approved automatically). Line: agent accuracy where a person checked.</p></div></div><div class="cb chart">${chart}</div></div>
  <div class="two"><div class="card"><div class="ch"><h3>Blocked before payment</h3></div><div class="cb"><div style="font-size:22px;font-weight:650" class="tab">${fmt(sel.blocked)}</div><div class="small muted">Stopped by blocking rules this week (duplicates, blocked vendors).</div></div></div>

function filterActions(f) {
  return S.actions.filter((a) => {
    if (f.status && a.status !== f.status) return false;
    if (f.vendor && !(`${a.vendorName} ${a.vendorCode}`.toLowerCase().includes(f.vendor.toLowerCase()))) return false;
    if (f.q && !a.number.toLowerCase().includes(f.q.toLowerCase())) return false;
    if (f.week) { const s = new Date(f.week + "T00:00"); if (a.createdAt < s || a.createdAt >= new Date(s.getTime() + 7 * DAY)) return false; }
    if (f.source && a.source !== f.source) return false;
    switch (f.flag) {
      case "money_at_risk": return moneyAtRisk(a);
      case "overridden": return a.review?.decision === "approve" && a.results.some(isControlFailure);
      case "agent_wrong": return a.review && !a.review.agentCorrect;
      case "reviewed": return Boolean(a.review);
      case "escalated": return a.computed === "needs_human";
      case "auto": return a.status === "auto_approved";
    }
    return true;
  }).sort((x, y) => y.createdAt - x.createdAt);
}

}

function vReviewQueue() {

  ${pend.map((a) => `<tr class="hov"><td><button class="lnk" data-a="action" data-id="${a.id}">${esc(a.number)}</button><div class="small muted">${esc(a.vendorName)}</div></td><td class="r tab">${fmt(a.amount)}</td><td class="small">${esc(a.reasons[0])}${a.reasons.length > 1 ? ` <span class="muted">+${a.reasons.length - 1}</span>` : ""}</td><td>${RANK[u.role] >= RANK[a.requiredRole] ? badge([APPROVER[a.requiredRole], "neutral"]) : badge([APPROVER[a.requiredRole], "warn"])}</td><td class="small muted">${tFmt(a.createdAt)}</td></tr>`).join("")}
  </tbody></table>` : empty("Queue is empty", "Nothing is waiting for a person.")}</div>

}

function vAction() {

  <div class="two"><div class="stack">
    <div class="card"><div class="cb"><dl class="meta">
      <div><dt>Amount</dt><dd class="tab">${fmt(a.amount)}</dd></div><div><dt>Vendor</dt><dd>${esc(a.vendorName)} <span class="muted small">${esc(a.vendorCode)}</span></dd></div>
      <div><dt>PO</dt><dd>${a.po ?? "None"}</dd></div><div><dt>Goods received note</dt><dd>${a.grn ?? "None"}</dd></div>
      <div><dt>Invoice date</dt><dd>${a.invoiceDate}</dd></div><div><dt>GL code</dt><dd>${a.gl}</dd></div>
      <div><dt>Autonomy level</dt><dd>Level ${a.level}</dd></div><div><dt>Agent</dt><dd>${esc(agent.name)} <span class="muted small">v${a.agentVersion}</span></dd></div>

    <div class="card"><div class="ch"><h3>What the agent proposed</h3></div><div class="cb">
      <div><b>${DECISION[a.proposed]}</b> <span class="muted">· ${pct(a.confidence, 0)} sure · GL ${a.gl}</span></div>
      <div class="ink2">“${esc(a.reason)}”</div>
    </div></div>
    <div class="card"><div class="ch"><h3>What Control Room decided</h3>${statusBadge(a.status)}</div><div class="cb">
      <ul style="margin:0;padding-left:18px">${a.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
      ${a.requiredRole && a.status === "pending_review" ? `<div class="small">Needs: <b>${APPROVER[a.requiredRole]}</b></div>` : ""}
    </div></div>
    <div class="card"><div class="ch"><div><h3>Rule results</h3><p>Rule set ${esc(a.ruleSet)}</p></div></div><div class="cb"><ul class="rl">
      ${a.results.map((r) => `<li>${ruleIcon(r.result)}<div><b>${esc(r.name)}</b> <span class="small muted">v${r.version}</span> ${r.result === "fail" ? badge(r.severity === "block" ? ["Blocks", "bad"] : r.routing ? ["Routes approval", "info"] : ["Needs a person", "warn"]) : ""}<div class="small ink2">${esc(r.explanation)}</div></div></li>`).join("")}
    </ul></div></div>
    <div class="card"><div class="ch"><div><h3>Audit records</h3><p>Hash-chained and append-only</p></div><button class="lnk small" data-a="go" data-page="audit">Audit trail →</button></div><div class="tw"><table><thead><tr><th>#</th><th>Event</th><th>By</th><th>When</th><th>Fingerprint</th></tr></thead><tbody>${recs.map((r) => `<tr><td class="tab">${r.seq}</td><td>${esc(r.type)}</td><td>${esc(r.actor.name)}</td><td class="small muted">${tFmt(r.at)}</td><td class="mono muted">${r.hash.slice(0, 12)}…</td></tr>`).join("")}</tbody></table></div></div>
  </div><div class="stack">
    ${a.review ? `<div class="card"><div class="ch"><h3>${a.review.spot ? "Spot check" : "Decision"}</h3>${badge(a.review.decision === "approve" ? ["Approved", "good"] : ["Rejected", "bad"])}</div><div class="cb small">
      <div><b>${esc(a.review.byName)}</b> · ${tFmt(a.review.at)}</div><div class="ink2">“${esc(a.review.reason)}”</div>
      <div>Agent was ${a.review.agentCorrect ? `<span class="good">right</span>` : `<span class="bad">wrong</span>`} (should have: ${DECISION[a.review.correct].toLowerCase()})</div>
      ${moneyAtRisk(a) ? `<div class="alert t-bad">Approved despite a failed check. Counts as money at risk.</div>` : ""}</div></div>` : ""}
    ${canDecide ? (enough ? `<div class="card" style="border-color:var(--brand)"><div class="ch"><h3>${a.status === "logged" ? "Spot check this decision" : "Your decision"}</h3></div><div class="cb">
      ${failed && a.status !== "logged" ? `<div class="alert t-warn">${failed} check${failed > 1 ? "s" : ""} failed. Approving overrides ${failed > 1 ? "them" : "it"} and counts as money at risk.</div>` : ""}
      <label class="f">Reason <span class="h">Required. The auditor will see this.</span><textarea class="i" id="rv-reason" rows="3" placeholder="e.g. Confirmed price change with the buyer"></textarea></label>

      <div class="grid2"><button class="btn good" data-a="review" data-id="${a.id}" data-d="approve" data-next="${next?.id ?? ""}">${a.status === "logged" ? "Should approve" : "Approve"}</button><button class="btn sec" data-a="review" data-id="${a.id}" data-d="reject" data-next="${next?.id ?? ""}">${a.status === "logged" ? "Should reject" : "Reject"}</button></div>
    </div></div>` : `<div class="alert t-info">This invoice needs a decision by ${APPROVER[a.requiredRole].toLowerCase()}. Switch to Dana (controller) or Alex (admin) in the bar above.</div>`) : ""}
  </div></div>`;
}

/* ============================================================ supplier invoices (buyer) */
const BUY_STATUS = { draft: ["Draft", "neutral"], submitted: ["Received", "info"], under_review: ["Waiting for a decision", "warn"], approved: ["Approved, not yet scheduled", "good"], needs_changes: ["Sent back to supplier", "warn"], rejected: ["Rejected", "bad"], scheduled: ["Payment scheduled", "brand"], paid: ["Paid", "good"], cancelled: ["Cancelled", "neutral"] };
const SUP_STATUS = { ...BUY_STATUS, submitted: ["Sent", "info"], under_review: ["With buyer for approval", "info"], approved: ["Approved", "good"], needs_changes: ["Needs changes", "warn"] };
function vInvoices() {
  const tabs = [["under_review", "Waiting for a decision"], ["approved", "Ready to pay"], ["scheduled", "Scheduled"], ["paid", "Paid"], ["needs_changes", "Sent back"], ["all", "All"]];
  const t = U.p.tab ?? "under_review";
  const visible = S.invoices.filter((i) => i.status !== "draft");
  const rows = visible.filter((i) => t === "all" || i.status === t);
  return ph("Supplier invoices", "Invoices your suppliers sent through the supplier portal. Each one goes through the same AI check, rules and approval limits as any other invoice.", `<button class="btn sec" data-a="go" data-page="suppliers">Suppliers & bank changes</button>`) + `
  <div class="tabs">${tabs.map(([k, l]) => `<button aria-selected="${t === k}" data-a="invtab" data-tab="${k}">${l}<span class="n tab">${visible.filter((i) => k === "all" || i.status === k).length}</span></button>`).join("")}</div>
  <div class="card tw">${rows.length ? `<table><thead><tr><th>Invoice</th><th>Supplier</th><th>PO</th><th class="r">Amount</th><th>Status</th><th>Received</th><th>Due</th></tr></thead><tbody>
  ${rows.map((i) => { const v = vendorByCode(i.vendorCode); const a = S.actions.find((x) => x.id === i.actionId); return `<tr class="hov"><td><button class="lnk" data-a="invoice" data-id="${i.id}">${esc(i.number)}</button>${i.kind === "credit_note" ? ` <span class="badge t-info">Credit note</span>` : ""}${i.revision > 1 ? ` <span class="small muted">resent</span>` : ""}</td><td>${esc(v.name)}<div class="small muted">${v.code}</div></td><td class="muted">${i.po ?? "None"}</td><td class="r tab">${i.kind === "credit_note" ? "−" : ""}${fmt(invTotal(i))}</td><td>${badge(BUY_STATUS[i.status])}${a?.status === "blocked" ? ` <span class="small bad">blocked by a rule</span>` : ""}</td><td class="small muted">${dFmt(i.sentAt)}</td><td class="small muted">${i.status === "scheduled" ? "Paying " + dFmt(i.payOn + "T12:00") : i.status === "paid" ? "Paid " + dFmt(i.paidOn + "T12:00") : dFmt(i.due + "T12:00")}</td></tr>`; }).join("")}
  </tbody></table>` : empty("Nothing here", "No supplier invoices with this status.")}</div>`;
}

function linesTable(inv) {
  return `<div class="tw"><table><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Unit price</th><th class="r">Tax</th><th class="r">Amount</th></tr></thead><tbody>
  ${inv.lines.map((l) => `<tr><td>${esc(l.d)}</td><td class="r tab">${l.q}</td><td class="r tab">${fmt(l.u)}</td><td class="r tab muted">${l.tax ? (l.tax / 100).toFixed(2) + "%" : "-"}</td><td class="r tab">${fmt(l.q * l.u)}</td></tr>`).join("")}
  </tbody></table></div><div class="tot"><div><span class="muted">Subtotal</span><span class="tab">${fmt(invSubtotal(inv))}</span></div><div><span class="muted">Tax</span><span class="tab">${fmt(invTotal(inv) - invSubtotal(inv))}</span></div><div class="big"><span>${inv.kind === "credit_note" ? "Total credit" : "Total"}</span><span class="tab">${fmt(invTotal(inv))}</span></div></div>`;
}
const timeline = (inv, map) => `<ol class="tl">${inv.events.map((e) => `<li><span class="dot"></span><div><div style="font-weight:500">${map[e.status][0]}</div>${e.note ? `<div class="small ink2">${esc(e.note)}</div>` : ""}<div class="small muted">${tFmt(e.at)}${e.who ? " · " + esc(e.who) : ""}</div></div></li>`).join("")}</ol>`;
const thread = (inv, mine, canPost, emptyText) => `<div class="msgs">${inv.msgs.length ? inv.msgs.map((m) => `<div class="msg ${m.from === mine ? "me" : ""}">${esc(m.body)}<div class="by">${esc(m.by)} · ${tFmt(m.at)}</div></div>`).join("") : `<div class="small muted">${emptyText}</div>`}</div>
  ${canPost ? `<div style="display:flex;gap:8px"><input class="i" id="msg-${inv.id}" placeholder="Write a message"><button class="btn sec" data-a="msg" data-id="${inv.id}" data-from="${mine}">Send</button></div>` : ""}`;

function vInvoice() {

  const u = me(); const c = connOf(inv); const v = vendorByCode(c.vendorCode); const acct = S.supplierAccounts.find((x) => x.id === inv.accountId);
  const a = S.actions.find((x) => x.id === inv.actionId); const bank = bankOf(c);
  const pendingChange = S.bankChanges.find((b) => b.connId === c.id && b.status === "pending");
  const failed = a ? a.results.filter(isControlFailure).length : 0;
  const enough = !a || a.status !== "pending_review" || RANK[u.role] >= RANK[a.requiredRole ?? "reviewer"];
  const canDecide = inv.status === "under_review" && can(u.role, "review") && enough;
  const canPay = can(u.role, "payments") && inv.kind === "invoice" && ["approved", "scheduled"].includes(inv.status);
  const payFrom = S.bankAccounts.find((b) => b.id === inv.payFrom);

  return `<button class="back" data-a="go" data-page="invoices">← Supplier invoices</button>` +
  ph(`${inv.kind === "credit_note" ? "Credit note" : "Invoice"} ${esc(inv.number)} ${badge(BUY_STATUS[inv.status])}`, `From ${esc(v.name)} (${v.code})${inv.revision > 1 ? ` · sent ${inv.revision} times` : ""}`, `<button class="btn sec" data-a="pdf" data-id="${inv.id}">View PDF</button>`) + `
  ${pendingChange ? `<div class="alert t-warn"><b>Bank detail change waiting</b>This supplier asked to change where they're paid. Payments are on hold until someone decides it on the Suppliers page.</div>` : ""}
  <div class="two"><div class="stack">
    <div class="card"><div class="cb"><dl class="meta"><div><dt>Invoice date</dt><dd>${dFmt(inv.date + "T12:00")}</dd></div><div><dt>Due</dt><dd>${dFmt(inv.due + "T12:00")}</dd></div><div><dt>PO</dt><dd>${inv.po ?? "None"}</dd></div><div><dt>Delivery record</dt><dd>${inv.grn ?? "None"}</dd></div><div><dt>Pay to</dt><dd>${bank ? `${esc(bank.bank)} ••${bank.last4}` : "No approved account"}</dd></div>${payFrom ? `<div><dt>Pay from</dt><dd>${esc(payFrom.nickname)} ••${payFrom.last4}</dd></div>` : ""}${inv.payOn ? `<div><dt>Payment date</dt><dd>${dFmt(inv.payOn + "T12:00")}</dd></div>` : ""}${inv.ref ? `<div><dt>Payment reference</dt><dd>${esc(inv.ref)}</dd></div>` : ""}</dl>
    ${linesTable(inv)}${inv.notes ? `<div class="sentence"><span class="muted">Supplier's note: </span>${esc(inv.notes)}</div>` : ""}</div></div>
    <div class="card"><div class="ch"><div><h3>AI check and rules</h3><p>${a ? `Checked by ${esc(agentById(a.agentId).name)} and your rules. The supplier doesn't see any of this.` : "Credit notes are checked by a person."}</p></div>${a ? `<button class="lnk small" data-a="action" data-id="${a.id}">Full detail →</button>` : ""}</div>
    ${a ? `<div class="cb"><div class="small">Agent proposed: <b>${DECISION[a.proposed]}</b> · ${pct(a.confidence, 0)} sure · Outcome: ${statusBadge(a.status)}${a.requiredRole && a.status === "pending_review" ? ` · needs ${APPROVER[a.requiredRole].toLowerCase()}` : ""}</div>
      <div class="small ink2">“${esc(a.reason)}”</div><ul class="rl">${a.results.map((r) => `<li>${ruleIcon(r.result)}<div><b>${esc(r.name)}</b> <span class="small muted">v${r.version}</span><div class="small ink2">${esc(r.explanation)}</div></div></li>`).join("")}</ul></div>` : ""}</div>
    <div class="card"><div class="ch"><h3>Messages with the supplier</h3></div><div class="cb">${thread(inv, "buyer", can(u.role, "review") || can(u.role, "suppliers:manage"), "No messages yet.")}</div></div>
  </div><div class="stack">
    ${canDecide ? `<div class="card" style="border-color:var(--brand)"><div class="ch"><h3>Your decision</h3></div><div class="cb">
      ${a?.status === "blocked" ? `<div class="alert t-bad">A control blocked this invoice, so it can't be approved. Send it back or reject it.</div>` : failed ? `<div class="alert t-warn">${failed} check${failed > 1 ? "s" : ""} failed. Approving overrides ${failed > 1 ? "them" : "it"}.</div>` : ""}
      <label class="f">Reason <span class="h">Kept internal; the auditor sees it</span><textarea class="i" id="dc-reason" rows="2">Matches the PO and the delivery record</textarea></label>
      <label class="f">Message to the supplier <span class="h">Needed to send back or reject. The supplier sees it.</span><textarea class="i" id="dc-msg" rows="2" placeholder="e.g. Please add the PO number and send it again"></textarea></label>
      ${a?.status !== "blocked" ? `<button class="btn good full" data-a="decide" data-id="${inv.id}" data-d="approve">Approve</button>` : ""}
      <div class="grid2"><button class="btn sec" data-a="decide" data-id="${inv.id}" data-d="send_back">Send back</button><button class="btn bad" data-a="decide" data-id="${inv.id}" data-d="reject">Reject</button></div>
    </div></div>` : inv.status === "under_review" && !enough ? `<div class="alert t-info">This invoice needs a decision by ${APPROVER[a.requiredRole].toLowerCase()}.</div>` : ""}
    ${canPay ? `<div class="card"><div class="ch"><div><h3>${inv.status === "scheduled" ? "Payment scheduled" : "Pay this invoice"}</h3><p>${fmt(invTotal(inv))} to ${bank ? `${esc(bank.bank)} ••${bank.last4}` : "no approved account"}</p></div></div><div class="cb">
      ${blockReason ? `<div class="alert t-warn">${blockReason}</div>` : ""}
      <label class="f">Pay from<select class="i" id="pay-from">${S.bankAccounts.filter((b) => b.state === "active").map((b) => `<option value="${b.id}" ${b.isDefault ? "selected" : ""}>${esc(b.nickname)} · ${esc(b.bank)} ••${b.last4}</option>`).join("")}</select></label>

        <button class="btn good full" data-a="paid" data-id="${inv.id}">Mark as paid</button></div>` : ""}
    </div></div>` : ""}
    <div class="card"><div class="ch"><h3>Supplier</h3></div><div class="cb small"><b>${esc(acct.legalName)}</b><div class="muted">EIN ${esc(acct.ein ?? "-")}</div><div class="muted">${esc(acct.email)}${acct.phone ? " · " + esc(acct.phone) : ""}</div><div class="muted">${esc(acct.address ?? "")}</div></div></div>
    <div class="card"><div class="ch"><div><h3>Timeline</h3><p>What the supplier sees, in their words</p></div></div><div class="cb">${timeline(inv, BUY_STATUS)}</div></div>
  </div></div>`;
}

function vSuppliers() {
  const u = me(); const manage = can(u.role, "suppliers:manage");
  const pend = S.bankChanges.filter((b) => b.status === "pending");
  const done = S.bankChanges.filter((b) => b.status !== "pending").slice(0, 8);

/* ============================================================ replay testing */
function runReplay(ds, agentIds) {
  const reports = agentIds.map((id) => {
    const agent = agentById(id);
    let right = 0, misApproved = 0, misApprovedN = 0, wrongBlocked = 0, wrongBlockedN = 0, caught = 0, escalated = 0;
    const errors = [];
    const seen = new Map();
    ds.cases.forEach((c) => {
      const p = mockDecide(agent, c, c.issue);
      const prior = seen.get(c.vendorCode) ?? [];
      const ctx = { subject: { ...c, at: c.at }, vendor: vendorByCode(c.vendorCode), po: c.po ? S.pos[c.po] ?? null : null, grnQty: c.po && S.grns[c.po] !== undefined ? S.grns[c.po] : null, prior, confidence: p.confidence };
      const results = activeRules().map((r) => evalRule(r, ctx));
      prior.push({ number: c.number, amount: c.amount, date: c.date }); seen.set(c.vendorCode, prior);
      if (p.decision === "escalate") escalated++;
      if (p.decision === c.correct) { right++; return; }
      const ruleCatch = results.some(isControlFailure);
      if (p.decision === "approve") { misApproved += c.amount; misApprovedN++; if (ruleCatch) caught += c.amount; }
      if (c.correct === "approve" && p.decision !== "approve") { wrongBlocked += c.amount; wrongBlockedN++; }
      errors.push({ c, said: p.decision, conf: p.confidence, ruleCatch, rules: results.filter((r) => r.result === "fail").map((r) => r.name) });
    });
    errors.sort((a, b) => b.c.amount - a.c.amount);
    return { agentId: id, name: agent.name, n: ds.cases.length, accuracy: right / ds.cases.length, misApproved, misApprovedN, wrongBlocked, wrongBlockedN, caught, escalation: escalated / ds.cases.length, cost: agent.cost * ds.cases.length, worst: errors.slice(0, 20) };
  });
  return reports;
}

function draftFromPO(connId, poN) {
  const p = openPOs(sme(), connId).find((x) => x.n === poN);
  const ready = Math.max(0, p.received - p.qtyBilled);
  return { po: p.n, lines: [{ d: `${vendorByCode(p.vendorCode).category} as ordered on ${p.n}`, q: String(ready || Math.max(1, p.qty - p.qtyBilled)), u: (p.unit / 100).toFixed(2), tax: "0" }] };
}
function editorHTML(f) {
  const tot = f.lines.reduce((t, l) => { const u = parseMoney(l.u || "0"); const q = parseInt(l.q, 10); const tx = Math.round(parseFloat(l.tax || "0") * 100); if (u === null || !(q >= 1)) return t; const amt = u * q; return { sub: t.sub + amt, tax: t.tax + Math.round((amt * tx) / 10000) }; }, { sub: 0, tax: 0 });
  return `<div class="card"><div class="ch"><h3>${f.kind === "credit_note" ? "Credit note details" : "Invoice details"}</h3></div><div class="cb"><div class="form">
    <label class="f">Bill to<select class="i" disabled><option>${S.org.name}</option></select></label>
    <label class="f">${f.kind === "credit_note" ? "Credit note number" : "Invoice number"} <span class="h">${f.lock ? "Can't change after sending" : "Your own numbering, unique per buyer"}</span><input class="i" data-ed="number" value="${esc(f.number)}" placeholder="${f.kind === "credit_note" ? "CN-001" : "BP-2001"}" ${f.lock ? "disabled" : ""}></label>
    <label class="f">Purchase order <span class="h">Invoices with a PO are approved faster</span><input class="i" data-ed="po" value="${esc(f.po ?? "")}" placeholder="PO-90005" ${f.kind === "credit_note" ? "disabled" : ""}></label>
    <label class="f">Date<input class="i" type="date" data-ed="date" value="${f.date}"></label>
  </div></div></div>
  <div class="card"><div class="ch"><h3>Lines</h3></div><div class="cb">
    ${f.lines.map((l, i) => `<div class="form" style="grid-template-columns:minmax(180px,3fr) repeat(3,minmax(90px,1fr)) auto;align-items:end">
      <label class="f">Description<input class="i" data-line="${i}" data-k="d" value="${esc(l.d)}"></label><label class="f">Qty<input class="i" data-line="${i}" data-k="q" value="${esc(l.q)}" inputmode="numeric"></label>
      <label class="f">Unit price ($)<input class="i" data-line="${i}" data-k="u" value="${esc(l.u)}" inputmode="decimal"></label><label class="f">Tax %<input class="i" data-line="${i}" data-k="tax" value="${esc(l.tax)}" inputmode="decimal"></label>
      <button class="btn ghost sm" data-a="delline" data-i="${i}" ${f.lines.length === 1 ? "disabled" : ""} aria-label="Remove line">✕</button></div>`).join("")}
    <div><button class="btn ghost sm" data-a="addline">+ Add line</button></div>
    <div class="tot"><div><span class="muted">Subtotal</span><span class="tab" id="ed-sub">${fmt(tot.sub)}</span></div><div><span class="muted">Tax</span><span class="tab" id="ed-tax">${fmt(tot.tax)}</span></div><div class="big"><span>${f.kind === "credit_note" ? "Total credit" : "Total"}</span><span class="tab" id="ed-total">${fmt(tot.sub + tot.tax)}</span></div></div>
  </div></div>
  <div class="card"><div class="cb"><label class="f">Notes for the buyer (optional)<textarea class="i" data-ed="notes" rows="2">${esc(f.notes ?? "")}</textarea></label></div></div>
  <div class="btns" style="align-items:center"><button class="btn p" data-a="saveinvoice">Save and review</button><span class="small muted">Nothing is sent yet. You'll see the checks before sending.</span></div>`;
}
function vSNew() {
  const s = sme(); const c = connsFor(s).find((x) => x.status === "active");
  if (!c) return empty("You aren't connected to any buyers yet", "Buyers invite you to the portal.");
  if (!U.ed) U.ed = { mode: "new", kind: "invoice", connId: c.id, number: "", po: "", date: iso(NOW), notes: "", lines: [{ d: "", q: "1", u: "", tax: "0" }] };
  const f = U.ed;
  if (f.mode === "edit") { const inv = S.invoices.find((i) => i.id === f.id); return `<button class="back" data-a="sinvoice" data-id="${inv.id}">← Back</button>` + ph(`Edit ${inv.kind === "credit_note" ? "credit note" : "invoice"} ${esc(inv.number)}`, "") + (inv.status === "needs_changes" && inv.supplierNote ? `<div class="alert t-warn"><b>What ${S.org.name} asked for</b>${esc(inv.supplierNote)}</div>` : "") + editorHTML(f); }
  if (f.kind === "credit_note") { const orig = S.invoices.find((i) => i.id === f.creditFor); return `<button class="back" data-a="sinvoice" data-id="${orig.id}">← Invoice ${esc(orig.number)}</button>` + ph(`Credit note for ${esc(orig.number)}`, "Reduce what the buyer owes, for example for returned or damaged goods. Adjust the lines to the amount you're crediting.") + editorHTML(f); }
  const pos = openPOs(s, c.id);
  return ph("New invoice", "Start from one of the buyer's purchase orders and the lines are filled in for what's been delivered. Or fill in your own.") + `
  ${!c.bankId ? `<div class="alert t-warn">${S.org.name} hasn't approved your bank details yet. You can prepare invoices now and send them once they approve.</div>` : ""}
  <div class="card"><div class="ch"><div><h3>Open purchase orders from ${S.org.name}</h3><p>Pick one to bill what's been delivered.</p></div></div><div class="cb">${pos.length ? `<div class="po-grid">${pos.map((p) => { const ready = Math.max(0, p.received - p.qtyBilled); return `<button class="po ${f.po === p.n ? "sel" : ""}" data-a="pickpo" data-po="${p.n}"><div style="display:flex;justify-content:space-between;gap:6px"><b>${p.n}</b><span class="tab">${fmt(p.amount)}</span></div><div class="small muted">Raised ${dFmt(p.raised)} · ${p.qty} × ${fmt(p.unit)}</div><div class="small">${p.received === 0 ? `<span class="warn">Nothing delivered yet</span>` : `${p.received} delivered · ${p.qtyBilled} billed · <b>${ready} ready to bill</b>`}</div></button>`; }).join("")}</div>` : `<div class="muted">Everything ordered has been billed.</div>`}</div></div>` + editorHTML(f);
}
function vSInvoice() {
  const s = sme(); const inv = S.invoices.find((i) => i.id === U.p.id && i.accountId === s.account.id);
  if (!inv) return empty("Invoice not found");
  const c = connOf(inv); const bank = bankOf(c); const editable = ["draft", "needs_changes"].includes(inv.status);
  const checks = editable ? checksFor(s, inv) : [];
  const credits = S.invoices.filter((i) => i.creditFor === inv.id && i.status !== "draft");
  return `<button class="back" data-a="go" data-page="s_invoices">← Invoices</button>` +
  ph(`${inv.kind === "credit_note" ? "Credit note" : "Invoice"} ${esc(inv.number)} ${badge(SUP_STATUS[inv.status])}`, `To ${S.org.name}`,
    `${inv.kind === "invoice" && ["approved", "scheduled", "paid"].includes(inv.status) ? `<button class="btn sec" data-a="credit" data-id="${inv.id}">Issue a credit note</button>` : ""}<button class="btn sec" data-a="pdf" data-id="${inv.id}">View PDF</button>`) + `
  ${inv.status === "needs_changes" ? `<div class="alert t-warn"><b>${S.org.name} asked for changes</b>${esc(inv.supplierNote)}</div>` : ""}
  ${inv.status === "rejected" ? `<div class="alert t-bad"><b>Rejected</b>${esc(inv.supplierNote)}</div>` : ""}
  ${inv.status === "scheduled" ? `<div class="alert t-good"><b>Payment scheduled for ${dFmt(inv.payOn + "T12:00")}</b>${fmt(invTotal(inv))} to your account ending ${bank?.last4}.</div>` : ""}
  ${inv.status === "paid" ? `<div class="alert t-good"><b>Paid on ${dFmt(inv.paidOn + "T12:00")}</b>Payment reference ${esc(inv.ref)}.</div>` : ""}
  <div class="two"><div class="stack">
    <div class="card"><div class="cb"><dl class="meta"><div><dt>Date</dt><dd>${dFmt(inv.date + "T12:00")}</dd></div>${inv.kind === "invoice" ? `<div><dt>Due</dt><dd>${dFmt(inv.due + "T12:00")}</dd></div>` : ""}<div><dt>PO</dt><dd>${inv.po ?? "None"}</dd></div><div><dt>Your vendor code</dt><dd>${c.vendorCode}</dd></div><div><dt>Paid into</dt><dd>${bank ? `${esc(bank.bank)} ••${bank.last4}` : "Not approved yet"}</dd></div></dl>
    ${linesTable(inv)}${inv.notes ? `<div class="sentence"><span class="muted">Notes: </span>${esc(inv.notes)}</div>` : ""}${credits.length ? `<div class="small muted">Credit notes against this invoice: ${credits.map((x) => `<button class="lnk" data-a="sinvoice" data-id="${x.id}">${esc(x.number)} (${fmt(invTotal(x))})</button>`).join(" ")}</div>` : ""}</div></div>
    <div class="card"><div class="ch"><h3>Messages with ${S.org.name}</h3></div><div class="cb">${thread(inv, "supplier", inv.status !== "draft", inv.status === "draft" ? "You can message the buyer once you've sent the invoice." : "No messages yet. Ask a question about this invoice here.")}</div></div>
  </div><div class="stack">
    ${editable ? `<div class="card" style="border-color:var(--sup)"><div class="ch"><div><h3>Before you send</h3><p>We check the invoice against the buyer's records so it doesn't get held up.</p></div></div><div class="cb">
      <ul class="rl">${checks.map(([l, m]) => `<li><span class="ic ${l === "ok" ? "ok" : l === "w" ? "w" : "x"}">${l === "ok" ? "✓" : l === "w" ? "!" : "✕"}</span><span class="small">${esc(m)}</span></li>`).join("")}</ul>
      <button class="btn p full" data-a="send" data-id="${inv.id}" ${checks.some((c) => c[0] === "x") ? "disabled" : ""}>${inv.revision ? "Send again" : "Send to buyer"}</button>
      <div class="grid2"><button class="btn sec sm" data-a="editinv" data-id="${inv.id}">Edit</button><button class="btn ghost sm" data-a="cancelinv" data-id="${inv.id}">${inv.revision ? "Cancel invoice" : "Delete draft"}</button></div></div></div>` : ""}
    <div class="card"><div class="ch"><h3>Where it is</h3></div><div class="cb">${timeline(inv, SUP_STATUS)}</div></div>
  </div></div>`;
}

    <button class="btn p full" data-a="sbank">Send for approval</button><div class="small muted">Until the buyer approves, they keep paying you into the account they already have.</div>
