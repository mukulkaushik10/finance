<title>Control Room Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: the real app's shells (staff sidebar app, supplier top-nav portal, sign-in screens) under a thin prototype bar that switches people. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --border: #e2e5ea; --border-strong: #cdd2da;
  --ink: #111827; --ink-2: #374151; --muted: #6b7280;
  --brand: #1f4fd1; --brand-ink: #ffffff; --brand-soft: #e8eefc;
  --sup: #0f766e; --sup-soft: #e0f2ef;
  --good: #12805c; --good-soft: #e3f4ec; --warn: #a35c00; --warn-soft: #fdf1dc;
  --bad: #c0352b; --bad-soft: #fbe7e5; --info: #2563a8; --info-soft: #e4effa; --neutral-soft: #eef0f3;
  --bar: #111827; --bar-ink: #e5e7eb;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1117; --surface: #161b22; --surface-2: #1d232c; --border: #2a313c; --border-strong: #3a4250;
  --ink: #e6e9ee; --ink-2: #c4cad4; --muted: #8b95a5; --brand: #6f93ff; --brand-ink: #0d1117; --brand-soft: #1c2a4d;
  --sup: #3cc4b4; --sup-soft: #12312e; --good: #4cc38a; --good-soft: #143326; --warn: #e3a54a; --warn-soft: #3a2a12;
  --bad: #f07267; --bad-soft: #3d1a17; --info: #6aa8ec; --info-soft: #172a40; --neutral-soft: #222a35; --bar: #000000; --bar-ink: #d1d5db; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1117; --surface: #161b22; --surface-2: #1d232c; --border: #2a313c; --border-strong: #3a4250;
  --ink: #e6e9ee; --ink-2: #c4cad4; --muted: #8b95a5; --brand: #6f93ff; --brand-ink: #0d1117; --brand-soft: #1c2a4d;
  --sup: #3cc4b4; --sup-soft: #12312e; --good: #4cc38a; --good-soft: #143326; --warn: #e3a54a; --warn-soft: #3a2a12;
  --bad: #f07267; --bad-soft: #3d1a17; --info: #6aa8ec; --info-soft: #172a40; --neutral-soft: #222a35; --bar: #000000; --bar-ink: #d1d5db; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.tab { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); } .small { font-size: 12px; } .ink2 { color: var(--ink-2); }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }

/* Prototype bar */
.pbar { background: var(--bar); color: var(--bar-ink); padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 12px; }
.pbar b { color: #fff; font-weight: 600; }
.pbar select, .pbar button { background: #1f2937; color: #f3f4f6; border: 1px solid #374151; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
.pbar .sp { flex: 1; }

/* Staff shell */
.shell { display: flex; min-height: calc(100vh - 34px); }
.side { width: 232px; flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.side .stick { position: sticky; top: 0; display: flex; flex-direction: column; min-height: calc(100vh - 34px); }
.brandrow { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; border-bottom: 1px solid var(--border); }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--brand); display: grid; place-items: center; flex: none; }
.logo.sup { background: var(--sup); }
.logo svg { width: 18px; height: 18px; }
.side nav { padding: 8px; display: grid; gap: 2px; }
.side nav button { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 8px 12px; border-radius: 7px; font-weight: 500; color: var(--ink-2); cursor: pointer; text-align: left; }
.side nav button:hover { background: var(--surface-2); }
.side nav button[aria-current="true"] { background: var(--brand-soft); color: var(--brand); }
.side nav svg { width: 16px; height: 16px; flex: none; }
.side nav .lbl { flex: 1; }
.side .foot { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.count { min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 11px; font-weight: 600; line-height: 19px; text-align: center; }
[aria-current="true"] .count { background: var(--brand); color: var(--brand-ink); }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 56px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
.content { width: 100%; max-width: 1280px; margin: 0 auto; padding: 24px; display: grid; gap: 18px; align-content: start; }

/* Supplier shell */
.sup-top { background: var(--surface); border-bottom: 1px solid var(--border); }
.sup-top .in { max-width: 1100px; margin: 0 auto; height: 56px; display: flex; align-items: center; gap: 20px; padding: 0 24px; }
.sup-top nav { display: flex; gap: 2px; flex-wrap: wrap; }
.sup-top nav button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
.sup-top nav button[aria-current="true"] { background: var(--sup-soft); color: var(--sup); }
.sup-content { max-width: 1100px; margin: 0 auto; padding: 24px; display: grid; gap: 18px; }
.supmode .btn.p { background: var(--sup); color: #fff; }
.supmode a.lnk, .supmode button.lnk { color: var(--sup); }

/* Components */
.ph { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.ph h1 { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ph p { color: var(--muted); max-width: 75ch; margin-top: 4px; }
.ph .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; min-width: 0; }
.ch { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.ch h3 { font-size: 15px; font-weight: 600; } .ch p { font-size: 13px; color: var(--muted); margin-top: 2px; }
.cb { padding: 14px 18px; display: grid; gap: 12px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.stack { display: grid; gap: 18px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.stats.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1300px) { .stats.six { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .stats.six { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; text-align: left; }
button.stat { cursor: pointer; } button.stat:hover { border-color: var(--brand); }
.stat .l { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; }
.stat .v { font-size: 24px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12px; color: var(--muted); margin-top: 1px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.t-good { background: var(--good-soft); color: var(--good); } .t-warn { background: var(--warn-soft); color: var(--warn); }
.t-bad { background: var(--bad-soft); color: var(--bad); } .t-info { background: var(--info-soft); color: var(--info); }
.t-neutral { background: var(--neutral-soft); color: var(--ink-2); } .t-brand { background: var(--brand-soft); color: var(--brand); } .t-sup { background: var(--sup-soft); color: var(--sup); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 7px; border: 1px solid transparent; height: 36px; padding: 0 16px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.p { background: var(--brand); color: var(--brand-ink); }
.btn.sec { background: var(--surface); border-color: var(--border-strong); }
.btn.sec:hover { background: var(--surface-2); }
.btn.good { background: var(--good); color: #fff; } .btn.bad { background: var(--bad); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink-2); } .btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 30px; padding: 0 11px; font-size: 13px; }
.full { width: 100%; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 500; }
label.f .h { font-weight: 400; font-size: 12px; color: var(--muted); }
.i { width: 100%; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 7px; height: 36px; padding: 0 10px; }
textarea.i { height: auto; padding: 8px 10px; resize: vertical; }
.chk-l { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.filters label.f { font-weight: 400; font-size: 12px; color: var(--muted); }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; padding: 9px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.hov:hover td { background: var(--surface-2); }
.r { text-align: right; }
.lnk { color: var(--brand); font-weight: 600; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.lnk:hover { text-decoration: underline; }
.back { font-size: 13px; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; justify-self: start; }
.alert { border-radius: 9px; padding: 10px 14px; font-size: 13px; }
.alert b { display: block; margin-bottom: 2px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px 18px; margin: 0; }
.meta dt { font-size: 12px; color: var(--muted); } .meta dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.tot { display: grid; justify-content: end; gap: 3px; font-size: 13px; }
.tot div { display: flex; gap: 28px; justify-content: space-between; }
.tot .big { font-weight: 650; font-size: 16px; }
.rl { list-style: none; margin: 0; padding: 0; display: grid; }
.rl li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.rl li:last-child { border-bottom: 0; }
.ic { width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; margin-top: 1px; }
.ic.ok { background: var(--good-soft); color: var(--good); } .ic.w { background: var(--warn-soft); color: var(--warn); } .ic.x { background: var(--bad-soft); color: var(--bad); } .ic.na { background: var(--neutral-soft); color: var(--muted); }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.tl li { display: grid; grid-template-columns: 12px 1fr; gap: 10px; }
.tl .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border-strong); margin-top: 5px; }
.tl li:last-child .dot { background: var(--brand); } .supmode .tl li:last-child .dot { background: var(--sup); }
.msgs { display: grid; gap: 8px; }
.msg { max-width: 85%; padding: 8px 11px; border-radius: 10px; background: var(--surface-2); font-size: 13px; white-space: pre-wrap; }
.msg.me { margin-left: auto; background: var(--brand-soft); } .supmode .msg.me { background: var(--sup-soft); }
.msg .by { font-size: 11px; color: var(--muted); margin-top: 3px; white-space: normal; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-weight: 500; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--brand-soft); color: var(--brand); }
.supmode .tabs button[aria-selected="true"] { background: var(--sup-soft); color: var(--sup); }
.tabs .n { color: var(--muted); font-size: 12px; margin-left: 3px; }
.utabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.utabs button { border: 0; background: transparent; padding: 9px 14px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.utabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); }
.po-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.po { text-align: left; border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; background: var(--surface); cursor: pointer; display: grid; gap: 2px; }
.po:hover, .po.sel { border-color: var(--sup); } .po.sel { background: var(--sup-soft); }
.empty { padding: 34px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 2px; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cmp > div { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.cmp > div.new { border-color: var(--warn); }
.secret { background: var(--surface-2); border-radius: 6px; padding: 6px 8px; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.bars { display: grid; gap: 4px; }
.prog { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.prog > div { height: 100%; background: var(--brand); transition: width .2s; }
.lvl { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.lvl > div { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.lvl > div.on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); background: var(--brand-soft); }
.lvl .k { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--brand); }
.sentence { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: grid; place-items: center; padding: 16px; z-index: 30; }
.modal { background: var(--surface); border-radius: 12px; width: min(640px, 100%); max-height: 85vh; overflow: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 9px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px); z-index: 40; }
.auth { min-height: calc(100vh - 34px); display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg); }
.auth .box { width: min(400px, 100%); display: grid; gap: 18px; }
.auth .wide { width: min(560px, 100%); }
.persona { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 9px 12px; cursor: pointer; text-align: left; }
.persona:hover { border-color: var(--brand); background: var(--brand-soft); }
.pill-ro { background: var(--info-soft); color: var(--info); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 500; }

@media (max-width: 1100px) { .two { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 820px) {
  .shell { flex-direction: column; }
  .side { width: 100%; border-right: 0; border-bottom: 1px solid var(--border); }
  .side .stick { position: static; min-height: 0; }
  .side nav { display: flex; overflow-x: auto; }
  .side nav button { white-space: nowrap; }
  .side .foot { display: none; }
  .topbar { padding: 0 16px; }
  .content, .sup-content { padding: 16px; }
  .sup-top .in { height: auto; flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
  .lvl { grid-template-columns: 1fr 1fr; }
  .cmp, .grid2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .prog > div { transition: none; } }
</style>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>
